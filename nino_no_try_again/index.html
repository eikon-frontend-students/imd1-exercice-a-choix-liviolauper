<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Jeu du Morpion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>
      <div class="logo">404</div>
      <span class="adjective">The requested page could not be found.</span>
      <span>TIC-TAC-TOE</span>
    </h1>

    <table class="xo shiny-edges">
      <tr>
        <td tabindex="0">&nbsp;</td>
        <td tabindex="0"></td>
        <td tabindex="0"></td>
      </tr>
      <tr>
        <td tabindex="0">&nbsp;</td>
        <td tabindex="0"></td>
        <td tabindex="0"></td>
      </tr>
      <tr>
        <td tabindex="0">&nbsp;</td>
        <td tabindex="0"></td>
        <td tabindex="0"></td>
      </tr>
    </table>

    <img
      tabindex="0"
      class="ttt-winner"
      src="https://assets.codepen.io/8247/tic-tac-toe-a-winner.webp"
      alt="Nancy Pelosi Tic-tac-toe winner GIF"
    />

    <footer>
      <div class="game-status">
        <div class="turn">
          <span class="player-1"
            ><b>⨯</b> <strong>PLAYER&thinsp;1</strong>'s turn</span
          >
          <span class="player-2"
            ><i>⭘</i> <strong>PLAYER&thinsp;2</strong>'s turn</span
          >
        </div>
        <div>
          <span class="win player-2 rubberband"
            ><strong>🎉 PLAYER&thinsp;1 wins!</strong></span
          >
          <span class="win player-1 rubberband"
            ><strong>🎉 PLAYER&thinsp;2 wins!</strong></span
          >
        </div>
      </div>

      <button class="reset-btn">
        <span class="reset">Reset</span>
        <span class="new-game">New Game</span>
      </button>
    <script src="script.js"></script>
  </body>
</html>
